# Checks every mod on PRs into main once they are ready (drafts skip), the release gate
# (docs/release-packaging.md: installs read the release branch, no test code ships) and the version sync.
# The bot's "chore: version plugins" PR is opened with GITHUB_TOKEN, so this does not run on it.
# Runs with no Claude login: plugin validate/test need none. Never add Claude credentials here.
name: plugin-check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: plugin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code@2.1.288
      - run: claude --version
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Versions in sync (workspaces = marketplace entries)
        run: node scripts/sync-plugin-versions.mjs --check
      - name: Release gate (installs read release; no test code ships)
        run: scripts/build-release.sh HEAD --check
      - name: Validate and test each mod
        run: |
          set -e
          for d in plugins/*/; do
            claude plugin validate --strict "$d"
            claude plugin test "$d"
          done
